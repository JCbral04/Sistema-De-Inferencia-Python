{% extends "base.html" %}
{% from "_macros.html" import csrf %}
{% block titulo %}Ingresar{% endblock %}
{% block contenido %}
<div class="tarjeta login">
  <h1>Ingresar</h1>
  <p class="sub">Sistema experto para el diagnóstico de fallas de computadores.</p>
  <form method="post">{{ csrf() }}
    <label for="correo">Correo</label><input id="correo" type="email" name="correo" required autofocus>
    <label for="clave">Contraseña</label><input id="clave" type="password" name="clave" required>
    <div class="acciones"><button class="btn" type="submit">Ingresar</button>
      <a href="{{ url_for('publico.registro') }}">Crear cuenta de cliente</a></div>
  </form>
</div>
{% endblock %}
