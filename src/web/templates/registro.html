{% extends "base.html" %}
{% from "_macros.html" import csrf %}
{% block titulo %}Crear cuenta{% endblock %}
{% block contenido %}
<div class="tarjeta login">
  <h1>Crear cuenta</h1>
  <p class="sub">Las cuentas nuevas se crean con el rol Cliente.</p>
  <form method="post">{{ csrf() }}
    <label for="nombre">Nombre completo</label><input id="nombre" type="text" name="nombre" required>
    <label for="correo">Correo</label><input id="correo" type="email" name="correo" required>
    <label for="clave">Contraseña (mínimo 8 caracteres)</label><input id="clave" type="password" name="clave" minlength="8" required>
    <div class="acciones"><button class="btn" type="submit">Crear cuenta</button>
      <a href="{{ url_for('publico.login') }}">Ya tengo cuenta</a></div>
  </form>
</div>
{% endblock %}
